version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: true
  modules-download-mode: readonly

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - godoclint
    - godot
    - godox
    - gomodguard
    - gomodguard_v2
    - ireturn
    - lll
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - tagliatelle
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*encoding/json.Encoder).Encode
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 20
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
    gosec:
      excludes:
        - G104
      config:
        global:
          audit: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: comment-spacings
          disabled: true
        - name: unused-receiver
          disabled: true
    sloglint:
      no-mixed-args: true
      kv-only: false
      context: scope
      static-msg: true
      key-naming-case: snake
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - funlen
          - gosec
          - mnd
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
