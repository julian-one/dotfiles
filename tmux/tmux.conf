# True color
set -sa terminal-features ",xterm-256color:RGB"

# Nvim wants focus events for autoread; default scrollback is only 2000 lines.
set -g focus-events on
set -g history-limit 50000

# Window numbering
set -g base-index 1
set -g renumber-windows on

# Status bar
set -g status 2
set -g status-position top
set -g status-justify absolute-centre

set -g status-style "bg=default,fg=colour244"
set -g status-left " #[bold]#S#[nobold] "
set -g status-right ""

set -g window-status-format " #I:#W "
set -g window-status-style "fg=colour244,bg=default"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=white,bold,bg=default"
set -g window-status-separator ""

# Empty line separator above the status bar; reset first so re-sourcing copies the default, not the blank
set -gu status-format
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] "#[bg=default]"

# Plugins (prefix + I to install)
# C-hjkl pane navigation; nvim gets the key first and forwards at its edge split.
# Also rebinds clear-screen to prefix C-l, since C-l is taken.
set -g @plugin 'christoomey/vim-tmux-navigator'

# ~/.config/tmux is a symlink into this repo, so tpm's default path would clone into it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

# tpm itself comes from brew, so it is not declared as a plugin; run stays last.
run '"$(brew --prefix tpm)/share/tpm/tpm"'
